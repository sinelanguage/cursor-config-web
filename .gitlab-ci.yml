stages:
  - lint
  - type-check
  - test
  - security
  - build
  - deploy

variables:
  NODE_VERSION: '24'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/cache/

image: node:${NODE_VERSION}

before_script:
  - npm ci --cache .npm/cache --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/cache/
    policy: pull

type-check:
  stage: type-check
  script:
    - npm run type-check
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/cache/
    policy: pull

test:
  stage: test
  script:
    - npm run test:ci -- --coverage --reporter=json
  coverage: '/(?<statements>\d+\.\d+%) covered/'
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/cache/
    policy: pull
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/

test:e2e:
  stage: test
  script:
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/cache/
    policy: pull
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

security:
  stage: security
  script:
    - npm audit --audit-level=moderate
  allow_failure: true

snyk:
  stage: security
  image: snyk/snyk:latest
  variables:
    SNYK_TOKEN: $SNYK_TOKEN
  script:
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high
    - snyk code test --severity-threshold=medium
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/cache/
    policy: pull
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
